<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
  <title>Lumen Hollow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌙</text></svg>" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #090814;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f4f1ff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090814;
    }

    canvas#game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(45, 27, 85, 0.3);
      border-radius: 4px;
      touch-action: none;
    }

    /* Mobile On-Screen Touch Controls */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      height: 140px;
      pointer-events: none;
      z-index: 50;
      padding: 0 16px;
      justify-content: space-between;
      align-items: flex-end;
    }

    .touch-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(42, 33, 73, 0.65);
      border: 2px solid rgba(255, 217, 138, 0.4);
      color: #ffd98a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,217,138,0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.1s, transform 0.1s;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(255, 217, 138, 0.35);
      transform: scale(0.92);
      border-color: #ffd98a;
    }

    .touch-btn.pulse-btn {
      width: 52px;
      height: 52px;
      border-color: rgba(255, 143, 171, 0.6);
      color: #ff8fab;
    }

    .touch-btn.action-btn {
      width: 48px;
      height: 48px;
      font-size: 16px;
    }

    .touch-btn.aura-btn {
      border-color: #ff3366;
      color: #ff3366;
      background: rgba(80, 20, 40, 0.6);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div id="touch-controls">
      <div class="touch-group">
        <button id="btn-left" class="touch-btn action-btn" aria-label="Move Left">◀</button>
        <button id="btn-right" class="touch-btn action-btn" aria-label="Move Right">▶</button>
        <button id="btn-dash" class="touch-btn action-btn" aria-label="Shadow Dash">💨</button>
      </div>
      <div class="touch-group" style="flex-wrap: wrap; max-width: 220px; justify-content: flex-end;">
        <button id="btn-aura" class="touch-btn action-btn aura-btn" aria-label="Sovereign Aura">👑</button>
        <button id="btn-bolt" class="touch-btn action-btn" aria-label="Umbral Bolt">⚡</button>
        <button id="btn-slash" class="touch-btn action-btn" aria-label="Lantern Slash">⚔️</button>
        <button id="btn-pulse" class="touch-btn pulse-btn" aria-label="Lantern Pulse">☼</button>
        <button id="btn-jump" class="touch-btn action-btn" aria-label="Jump">▲</button>
        <button id="btn-plunge" class="touch-btn action-btn" aria-label="Void Plunge">▼</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
